name: Release

# Matriz de builds (variantes por GPU):
#   - Windows x64: cpu | nvidia (CUDA EP do ORT) | amd-intel (Vulkan do whisper.cpp)
#   - Linux x64:   cpu | nvidia | amd-intel
#   - macOS:       apple-silicon (arm64 + Metal) | intel (x86_64 + Metal)
#   - Snapdragon:  Windows ARM64 (aarch64-pc-windows-msvc, CPU) — best effort,
#                  `continue-on-error` pois o ecossistema Rust/ORT em Win-ARM64
#                  ainda é imaturo; falha não bloqueia a release.
#
# Nota CUDA: nenhum job instala o CUDA toolkit — igual ao ambiente de dev local
# (sem nvcc), os deps compilam e a feature `cuda` só troca o binário pré-compilado
# do ONNX Runtime pela variante GPU (o usuário final precisa dos drivers NVIDIA).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    name: Windows x64 (${{ matrix.variant }})
    runs-on: windows-latest
    continue-on-error: ${{ matrix.variant != 'cpu' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            features: full
          - variant: nvidia
            features: full,cuda
          - variant: amd-intel
            features: full,vulkan

    env:
      # Workaround para o limite de path do MSVC ao compilar ggml-vulkan
      # (FTK1011, ver whisper-rs #252): desativa FileTracker.
      TrackFileAccess: false
      # Limite de path do Windows (CMAKE_OBJECT_PATH_MAX=250): o ExternalProject
      # vulkan-shaders-gen do ggml cria paths ~242 chars dentro do OUT_DIR do
      # whisper-rs-sys (src-tauri/target/release/build/whisper-rs-sys-<hash>/
      # out/build/ggml/...) e o CMake aborta com "object file directory has 242
      # characters" na variante vulkan. Target dir curto na raiz do drive corta
      # ~40 chars e resolve; afeta os 3 variants mas só quebra no vulkan — os
      # demais já passavam, target novo só muda o cache (key já distingue).
      CARGO_TARGET_DIR: ${{ github.workspace }}\\t

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            t
          key: windows-${{ matrix.variant }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-${{ matrix.variant }}-

      - name: Install CUDA toolkit (variante nvidia)
        # `--features cuda` ativa o build CUDA do llama.cpp (GGML_CUDA), que
        # exige nvcc; o runner não tem o toolkit instalado por padrão.
        if: matrix.variant == 'nvidia'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.2.0"
          log-file-suffix: windows-${{ matrix.variant }}

      - name: Install Vulkan SDK (variante amd-intel)
        if: matrix.variant == 'amd-intel'
        shell: bash
        run: |
          # O humbletim/install-vulkan-sdk extrai o instalador com 7z e, no
          # Windows, o SDK fica incompleto (só `Bin/`, sem `Include/` e `Lib/`)
          # -> o FindVulkan do CMake 4.x não acha nada e o whisper-rs-sys falha
          # com "Could NOT find Vulkan". Usamos o instalador oficial em modo
          # silencioso, que instala o SDK completo em C:\VulkanSDK\<versão>.
          set -e
          VERSION=$(curl -sL --retry 3 https://vulkan.lunarg.com/sdk/latest/windows.txt || echo "1.4.313.0")
          echo "Instalando Vulkan SDK $VERSION"
          # `sdk.lunarg.com` redireciona para S3; `Human=true` é exigido pelo endpoint
          if ! curl -sL --retry 3 -o /tmp/vulkan_sdk.exe "https://sdk.lunarg.com/sdk/download/$VERSION/windows/vulkan_sdk.exe?Human=true"; then
            echo "::warning::Falha ao baixar Vulkan SDK $VERSION"
            exit 0
          fi
          # Instalador oficial silencioso; pode falhar em runner com restrições — não bloqueia release (best-effort)
          if ! /tmp/vulkan_sdk.exe --accept-licenses --default-answer --confirm-command install; then
            echo "::warning::Instalador Vulkan SDK falhou — variante amd-intel ficará sem aceleração"
            exit 0
          fi
          SDK_DIR="$(ls -d /c/VulkanSDK/* 2>/dev/null | head -1)"
          if [ -z "$SDK_DIR" ]; then
            echo "::warning::SDK instalado mas C:/VulkanSDK não encontrado"
            ls -R /c/VulkanSDK 2>&1 | head -n 30 || true
            exit 0
          fi
          echo "VULKAN_SDK=$SDK_DIR" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$SDK_DIR" >> "$GITHUB_ENV"
          echo "VK_SDK_PATH=$SDK_DIR" >> "$GITHUB_ENV"
          echo "Vulkan SDK instalado em: $SDK_DIR"
          ls -lh "$SDK_DIR/Include/vulkan" 2>&1 | head -n 20 || ls -lh "$SDK_DIR" | head -n 30

          # O gerador Visual Studio do cmake crate quebra no ExternalProject
          # vulkan-shaders-gen do ggml: o custom-build .bat do INSTALL.vcxproj
          # falha com MSB8066 "cannot find the batch label specified - VCEnd"
          # e o passo de install do subprojeto nunca gera cmake_install.cmake,
          # mesmo com o vulkan-shaders-gen.exe compilado com sucesso. Ninja
          # (pré-instalado no runner) não usa .bat custom build e instala o
          # subprojeto corretamente. O cmake crate lê CMAKE_GENERATOR da env
          # quando o build.rs não fixa generator() — whisper-rs-sys não fixa.
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch ffmpeg/ffprobe sidecars (win64)
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh win64

      - name: Prepare native DLL staging dir
        shell: bash
        run: |
          rm -rf src-tauri/binaries/native
          mkdir -p src-tauri/binaries/native

      - name: Build app without bundle (gera as DLLs de runtime em target/release)
        shell: bash
        run: |
          # 1a fase: compila sem empacotar. Os build scripts das dependências
          # (ort-sys copy_dylibs) geram DirectML.dll e os providers CUDA do
          # onnxruntime em target/release, ao lado do exe. O bundle.resources
          # de src-tauri/tauri.windows.conf.json aponta para o diretório
          # estável `binaries/native` (vazio nesta fase) e o tauri-build
          # simplesmente o ignora. Nota: llama/ggml são estáticos desde a
          # mudança para default-features=false (ver Cargo.toml) — só as DLLs
          # de runtime do ort são dinâmicas.
          npm run tauri build -- --no-bundle --features ${{ matrix.features }}

      - name: Stage runtime DLLs como arquivos reais (segue symlinks)
        shell: bash
        run: |
          # As DLLs do onnxruntime são criadas pelo ort-sys como SYMLINKs para
          # $CARGO_HOME/registry em target/release (o runner roda como admin e a
          # criação de symlink não cai no fallback de cópia). Se o
          # bundle.resources fizesse o tauri-build ler essas DLLs via glob em
          # target/release, ele executaria fs::copy(src=destino do symlink,
          # dst=o próprio symlink) e o Windows falharia com "os error 32"
          # (sharing violation — abrir o mesmo arquivo para leitura e escrita).
          #
          # Copiamos seguindo o symlink (cp -L) para o diretório estável e
          # removemos os symlinks do target/release, evitando a auto-cópia.
          # GARANTIA: nenhuma DLL pode ficar para trás — o instalador tem que
          # ser autossuficiente. Falha (exit 1) se ort estiver nas features mas
          # nenhuma DLL for encontrada, para não publicar instalador quebrado.
          shopt -s nullglob
          dlls=(t/release/*.dll)
          if [ ${#dlls[@]} -eq 0 ]; then
            echo "::warning::Nenhuma DLL em target/release (build sem ort)"
          else
            echo "Staging ${#dlls[@]} DLL(s) para binaries/native/"
            cp -L "${dlls[@]}" src-tauri/binaries/native/
            # Remover apenas symlinks/DLLs após cópia bem-sucedida
            rm -f t/release/*.dll
            ls -lh src-tauri/binaries/native/
          fi

      - name: Build NSIS installer
        shell: bash
        run: |
          # 2a fase: o touch no config força o build script (tauri-build) a rodar
          # de novo; ele copia binaries/native/*.dll (arquivos reais) para junto
          # do exe e o tauri-bundler embarca as DLLs no instalador NSIS.
          # Isso cobre cpu/cuda/vulkan e ARM64 sem enumerar nomes.
          touch src-tauri/tauri.windows.conf.json
          npm run tauri build -- --features ${{ matrix.features }}

      - name: Rename installer with variant suffix
        shell: bash
        run: |
          # Instaladores da mesma versão teriam o mesmo nome entre variantes;
          # sufixar evita colisão nos assets da release.
          cd t/release/bundle/nsis
          for f in *-setup.exe; do
            mv "$f" "${f/-setup/-${{ matrix.variant }}-setup}"
          done

      - name: Validate installer contents (sidecars + exe)
        shell: bash
        run: |
          # Garantia de instalação limpa: o NSIS precisa conter legendai.exe,
          # ffmpeg.exe e ffprobe.exe — sem isso o usuário final instala um app
          # que abre mas falha em qualquer import de vídeo (erro de sidecar).
          cd t/release/bundle/nsis
          installer=$(ls *-setup.exe | head -1)
          echo "Validando $installer ..."
          listing=$(7z l "$installer")
          echo "$listing" | tail -40
          for required in legendai.exe ffmpeg.exe ffprobe.exe; do
            if ! echo "$listing" | grep -q " $required"; then
              echo "::error::$required não encontrado no instalador $installer"
              exit 1
            fi
          done
          echo "OK: sidecars e executável presentes no instalador."

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: legendai-windows-x64-${{ matrix.variant }}
          path: |
            t/release/bundle/nsis/*.exe
            t/release/bundle/nsis/*.txt
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.name }})
    runs-on: macos-latest
    # Intel (x86_64) é legado e o cross-compile do llama.cpp falha
    # (OpenMP/httplib/OpenSSL) — best-effort; o Apple Silicon é obrigatório.
    continue-on-error: ${{ matrix.name == 'intel' }}
    env:
      # whisper.cpp/ggml usa std::filesystem (path/u8string), introduzido no
      # macOS 10.15; sem esse piso o clang falha com "'path' is unavailable".
      # 11.0 cobre também o target arm64 (mínimo do Apple Silicon).
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: apple-silicon
            arch: arm64
            target: aarch64-apple-darwin
            sidecar: macos-arm64
            features: full,metal
          - name: intel
            arch: amd64
            target: x86_64-apple-darwin
            sidecar: macos-amd64
            # onnxruntime (ort) não publica build x86_64-apple-darwin
            # ("no prebuilt binaries available"); Intel Mac fica sem NLLB,
            # mantendo Whisper (stt) + LLM (llama) + Metal.
            features: stt,llama,metal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}-dt2
          restore-keys: macos-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}-dt2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch ffmpeg/ffprobe sidecars (macOS ${{ matrix.arch }})
        run: bash scripts/fetch-ffmpeg.sh ${{ matrix.sidecar }}

      - name: Configure llama.cpp (macOS intel - desativa OpenSSL)
        if: matrix.name == 'intel'
        run: |
          # O llama.cpp habilita HTTPS via OpenSSL no cpp-httplib por default
          # (option(LLAMA_OPENSSL ... ON) — LLAMA_CURL não existe mais). No
          # cross x86_64 a partir do runner arm64, o find_package(OpenSSL)
          # resolve para o Homebrew ARM64 e o link de libllama-common.dylib
          # falha com _ASN1_*/_ERR_* indefinidos. O toolchain força
          # LLAMA_OPENSSL=OFF (HTTPS do server não é usado pelo app) via
          # CMAKE_TOOLCHAIN_FILE, lido pelo cmake crate a partir da env.
          echo "CMAKE_TOOLCHAIN_FILE=$PWD/scripts/cmake/no-openssl.cmake" >> "$GITHUB_ENV"

      - name: Build DMG
        run: |
          # Metal em ambos os targets (todo hardware Apple suporta). onnxruntime.dll
          # é Windows-only (ver job windows); macOS usa a shared lib que o build
          # script do ort coloca junto ao binário. `--target` cross-compila o arch
          # irmão neste runner, produzindo um .dmg por entrada da matriz.
          npm run tauri build -- --features ${{ matrix.features }} --target ${{ matrix.target }}

      - name: Validate DMG contents (sidecars + exe)
        run: |
          # Garantia de instalação limpa: o .app dentro do DMG precisa conter
          # o executável e os sidecars ffmpeg/ffprobe em Contents/MacOS.
          set -e
          dmg=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)
          echo "Validando $dmg ..."
          hdiutil attach "$dmg" -nobrowse -quiet
          app=$(ls -d /Volumes/*/LegendAI.app | head -1)
          trap 'hdiutil detach "$(dirname "$app")" -quiet 2>/dev/null || true' EXIT
          for required in legendai ffmpeg ffprobe; do
            if [ ! -f "$app/Contents/MacOS/$required" ]; then
              echo "::error::$required não encontrado em $app/Contents/MacOS/"
              exit 1
            fi
          done
          echo "OK: sidecars e executável presentes no DMG."

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: legendai-macos-${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  snapdragon:
    name: Windows ARM64 (Snapdragon)
    # Best effort (ver nota do topo): não bloqueia a release se falhar.
    continue-on-error: true
    runs-on: windows-latest
    env:
      # ggml/whisper.cpp em Windows ARM64 não suportam MSVC — exigem clang.
      # O whisper-rs-sys seta pic(true), e o cc emite `-fPIC` para clang GNU;
      # o driver `clang` com --target=aarch64-pc-windows-msvc REJEITA -fPIC
      # ("unsupported option"). Com clang-cl o cc detecta família MSVC
      # (clang_cl) e não emite -fPIC (PIC é implícito no Windows); flags GNU
      # que vazem são ignoradas com warning, não erro. O cmake crate propaga
      # CC/CXX para CMAKE_C/CXX_COMPILER.
      CC: clang-cl
      CXX: clang-cl
      CMAKE_GENERATOR: Ninja
      # O cmake crate monta CMAKE_CXX_FLAGS a partir das flags do cc, sem os
      # defaults que o CMake adicionaria para MSVC — `/EHsc` (exceções C++)
      # faltava e o gguf.cpp falhava com "cannot use 'try' with exceptions
      # disabled". O cc aplica CFLAGS/CXXFLAGS por último (overrides).
      CFLAGS: /EHsc
      CXXFLAGS: /EHsc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (target ARM64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: win-arm64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: win-arm64-

      - name: Setup clang (ARM64 requer clang, não MSVC)
        shell: bash
        run: |
          # LLVM já vem no runner windows-latest; garantir clang-cl no PATH.
          # CC/CXX/CMAKE_GENERATOR já estão no env do job (ver comentário lá).
          which clang-cl || echo "clang-cl não encontrado no PATH"
          clang-cl --version || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch ffmpeg/ffprobe sidecars (winarm64)
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh winarm64

      - name: Prepare native DLL staging dir
        shell: bash
        run: |
          rm -rf src-tauri/binaries/native
          mkdir -p src-tauri/binaries/native

      - name: Build app without bundle (ARM64, gera DLLs)
        shell: bash
        run: |
          npm run tauri build -- --no-bundle --features full --target aarch64-pc-windows-msvc

      - name: Stage runtime DLLs (ARM64)
        shell: bash
        run: |
          shopt -s nullglob
          dlls=(src-tauri/target/aarch64-pc-windows-msvc/release/*.dll)
          if [ ${#dlls[@]} -eq 0 ]; then
            echo "Nenhuma DLL em aarch64 release"
          else
            cp -L "${dlls[@]}" src-tauri/binaries/native/
            rm -f src-tauri/target/aarch64-pc-windows-msvc/release/*.dll
            ls -lh src-tauri/binaries/native/
          fi

      - name: Build NSIS installer (ARM64, CPU)
        shell: bash
        run: |
          touch src-tauri/tauri.windows.conf.json
          npm run tauri build -- --features full --target aarch64-pc-windows-msvc

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: legendai-windows-arm64-cpu
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  ubuntu:
    name: Linux x64 (${{ matrix.variant }})
    # Ubuntu 24.04 (glibc 2.39): o onnxruntime pré-compilado (ort) exige
    # símbolos __isoc23_* (glibc >= 2.38) que não existem no 22.04 (2.35),
    # causando `undefined symbol` no link. AppImage/deb rodam em 24.04+.
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.variant != 'cpu' }}
    env:
      # linuxdeploy falha sem FUSE e com strip em binários Rust com libs
      # dinâmicas no runner; APPIMAGE_EXTRACT_AND_RUN extrai e executa, e
      # NO_STRIP evita o strip que quebra o link do onnxruntime estático.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            features: full
          - variant: nvidia
            features: full,cuda
          - variant: amd-intel
            features: full,vulkan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf \
            libvulkan-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ubuntu-${{ matrix.variant }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ubuntu-${{ matrix.variant }}-

      - name: Install CUDA toolkit (variante nvidia)
        # `--features cuda` ativa o build CUDA do llama.cpp (GGML_CUDA), que
        # exige nvcc; o runner não tem o toolkit instalado por padrão.
        if: matrix.variant == 'nvidia'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.2.0"
          log-file-suffix: linux-${{ matrix.variant }}

      - name: Install Vulkan SDK (variante amd-intel)
        if: matrix.variant == 'amd-intel'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch ffmpeg/ffprobe sidecars (linux64)
        run: bash scripts/fetch-ffmpeg.sh linux64

      - name: Build deb and AppImage
        run: |
          # Gera deb + AppImage (AppImage já tem APPIMAGE_EXTRACT_AND_RUN=1 e NO_STRIP=true no env do job para evitar "failed to run linuxdeploy"/FUSE/strip)
          # onnxruntime.dll injection is Windows-only (see the windows job).
          npm run tauri build -- --features ${{ matrix.features }} --bundles deb,appimage

      - name: Rename packages with variant suffix
        run: |
          # Mesma versão gera o mesmo nome entre variantes; sufixar evita
          # colisão nos assets da release.
          cd src-tauri/target/release/bundle
          V='${{ matrix.variant }}'
          for f in deb/*.deb; do mv "$f" "${f/.deb/-${V}.deb}"; done
          for f in appimage/*.AppImage; do mv "$f" "${f/.AppImage/-${V}.AppImage}"; done

      - name: Validate deb contents (sidecars + no missing libs)
        run: |
          # Garantia de instalação limpa: o deb precisa conter usr/bin/legendai,
          # ffmpeg e ffprobe. Além disso, com o llama estático (default-features
          # =false no Cargo.toml) o binário não pode linkar libllama/libggml —
          # libs build-time-only que quebrariam o app em máquina sem elas.
          set -e
          cd src-tauri/target/release/bundle
          deb=$(ls deb/*.deb | head -1)
          echo "Validando $deb ..."
          rm -rf /tmp/deb-extract && mkdir -p /tmp/deb-extract
          ar x --output=/tmp/deb-extract "$deb" data.tar.gz
          tar -xzf /tmp/deb-extract/data.tar.gz -C /tmp/deb-extract
          for required in usr/bin/legendai usr/bin/ffmpeg usr/bin/ffprobe; do
            if [ ! -f "/tmp/deb-extract/$required" ]; then
              echo "::error::$required não encontrado no deb"
              exit 1
            fi
          done
          missing=$(ldd /tmp/deb-extract/usr/bin/legendai 2>/dev/null | grep "not found" || true)
          if [ -n "$missing" ]; then
            echo "::error::Bibliotecas ausentes no binário do deb:"
            echo "$missing"
            exit 1
          fi
          if ldd /tmp/deb-extract/usr/bin/legendai 2>/dev/null | grep -qE "libllama|libggml"; then
            echo "::error::binário ainda linka libllama/libggml dinamicamente — o deb não as distribui"
            exit 1
          fi
          echo "OK: sidecars presentes e sem libs faltando no deb."

      - name: Upload deb and AppImage
        uses: actions/upload-artifact@v4
        with:
          name: legendai-linux-${{ matrix.variant }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [windows, macos, snapdragon, ubuntu]
    # Roda mesmo com variantes best-effort falhando (macOS intel, Windows
    # vulkan, Snapdragon marcam o job needs como failure, o que skipparia a
    # release sem este if). Só não roda se o run for cancelado.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Extract release notes for this version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python3 - "$VERSION" <<'PY'
          import re, sys, pathlib
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text()
          # Match "## [<version>]" or "## [Unreleased]" (case-insensitive).
          pattern = re.compile(r"^## \[(Unreleased|" + re.escape(version) + r")\]\s*$", re.IGNORECASE | re.MULTILINE)
          match = pattern.search(text)
          if not match:
              sys.exit("No CHANGELOG section for " + version)
          start = match.end()
          nxt = re.search(r"^## ", text[start:], re.MULTILINE)
          end = start + nxt.start() if nxt else len(text)
          pathlib.Path("RELEASE_NOTES.md").write_text(text[start:end].strip() + "\n")
          PY

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file RELEASE_NOTES.md \
            artifacts/*
